name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release_tag.outputs.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release tag
        id: release_tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
            TAG_NAME="ci-${SHORT_SHA}"
          fi
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=${TAG_NAME}" >> "$GITHUB_ENV"

      - name: Create tag for manual run
        if: ${{ github.ref_type != 'tag' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${RELEASE_TAG}" "${GITHUB_SHA}"
          git push origin "${RELEASE_TAG}"

      - name: Write release notes
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## 文件说明

          产物命名规则：`PhotoHelper-<runtime>-sc-<true|false>.zip`

          - `win-x64`: 64 位 Intel/AMD CPU
          - `win-x86`: 32 位 Intel/AMD CPU
          - `win-arm64`: 64 位 ARM CPU
          - `sc-true`: self-contained（自带 .NET 运行时）
          - `sc-false`: framework-dependent（依赖系统已安装的 .NET 运行时）

          ## 版本包含的产物

          - `PhotoHelper-win-x64-sc-true.zip`
          - `PhotoHelper-win-x64-sc-false.zip`
          - `PhotoHelper-win-x86-sc-true.zip`
          - `PhotoHelper-win-x86-sc-false.zip`
          - `PhotoHelper-win-arm64-sc-true.zip`
          - `PhotoHelper-win-arm64-sc-false.zip`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag_name }}
          name: ${{ steps.release_tag.outputs.tag_name }}
          body_path: RELEASE_NOTES.md
  build-release:
    runs-on: windows-latest
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - win-x64
          - win-x86
          - win-arm64
        selfContained:
          - true
          - false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore .\PhotoHelper.csproj

      - name: Publish
        run: dotnet publish .\PhotoHelper.csproj -c Release -r ${{ matrix.runtime }} --self-contained ${{ matrix.selfContained }} -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -o .\artifacts\publish\${{ matrix.runtime }}\sc-${{ matrix.selfContained }}

      - name: Package
        run: Compress-Archive -Path .\artifacts\publish\${{ matrix.runtime }}\sc-${{ matrix.selfContained }}\* -DestinationPath .\artifacts\PhotoHelper-${{ matrix.runtime }}-sc-${{ matrix.selfContained }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: .\artifacts\PhotoHelper-${{ matrix.runtime }}-sc-${{ matrix.selfContained }}.zip
